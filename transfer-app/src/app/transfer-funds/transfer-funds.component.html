<div class="transfer-funds-container">
    <h2>Transfer Funds</h2>
    <form [formGroup]="transferForm" (ngSubmit)="onSubmit()">
        <div>
            <label for="sender_account_number">Sender Account Number:</label>
            <input id="sender_account_number" formControlName="sender_account_number" type="text" />
        </div>
        <div>
            <label for="recipient_account_number">Recipient Account Number:</label>
            <input id="recipient_account_number" formControlName="recipient_account_number" type="text" />
        </div>
        <div>
            <label for="amount">Amount:</label>
            <input id="amount" formControlName="amount" type="number" />
        </div>
        <button type="submit" [disabled]="transferForm.invalid">Transfer</button>
    </form>

    <div *ngIf="message" class="success-message">
        {{ message }}
    </div>
    <div *ngIf="error" class="error-message">
        {{ error }}
    </div>
</div>
